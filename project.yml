name: Sonda
options:
  bundleIdPrefix: com.kisnner26
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
packages:
  SondaCore:
    path: .
targets:
  Sonda:
    type: application
    platform: iOS
    sources:
      - Sonda
    dependencies:
      - package: SondaCore
    info:
      path: Sonda/Info.plist
      properties:
        CFBundleDisplayName: Sonda
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        NSBluetoothAlwaysUsageDescription: Sonda escucha los anuncios Bluetooth de los dispositivos cercanos para mostrarlos y explicarlos. No guarda nada fuera de tu iPhone.
        NSCameraUsageDescription: Sonda usa la cámara para leer códigos QR y para ver si un mando a distancia emite infrarrojo.
        NSMicrophoneUsageDescription: Sonda usa el micrófono para el analizador de espectro, el sonómetro y el detector de tonos DTMF. El audio no se guarda ni se envía.
        NSLocalNetworkUsageDescription: Sonda busca equipos y servicios en tu red local (Bonjour, puertos, ping) para mostrarte qué hay conectado.
        NSMotionUsageDescription: Sonda lee el magnetómetro, el barómetro y el acelerómetro para sus medidores.
        NSLocationWhenInUseUsageDescription: Sonda usa la ubicación y la brújula para mostrar tus coordenadas y el rumbo. No se envían a ningún sitio.
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _homekit._tcp
          - _hap._tcp
          - _googlecast._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _pdl-datastream._tcp
          - _companion-link._tcp
          - _device-info._tcp
          - _spotify-connect._tcp
          - _rfb._tcp
          - _mqtt._tcp
          - _matter._tcp
          - _workstation._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kisnner26.sonda
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Sonda:
    build:
      targets:
        Sonda: all
    run:
      config: Debug
